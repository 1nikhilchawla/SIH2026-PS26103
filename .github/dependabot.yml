# Weekly dependency update PRs. Each one changes a sealed file
# (requirements.txt, Dockerfile or a workflow), so CI's integrity check fails
# until a person re-seals and signs the manifest - an update can be proposed
# automatically but never deployed automatically.
version: 2
updates:
  - package-ecosystem: pip
    directory: /anumaan
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /anumaan
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
