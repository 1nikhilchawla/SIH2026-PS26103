# ANUMAAN CI. Runs on every pull request and every push to main.
#
# Make it a required status check in branch protection. Then no change -
# from a person, a bot or an AI agent - reaches main unless the sealed files
# still match integrity/MANIFEST.json, every test passes and no installed
# package has a known vulnerability.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow reads the repository and nothing else. No
# write token exists for a compromised step to use.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: anumaan
    steps:
      # Actions are pinned to a full commit SHA, not a movable tag, so a
      # compromised upstream tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Integrity - sealed files match integrity/MANIFEST.json
        run: python scripts/integrity.py verify

      - name: Integrity - manifest signature (when the key is configured)
        env:
          ANUMAAN_INTEGRITY_KEY: ${{ secrets.ANUMAAN_INTEGRITY_KEY }}
        run: |
          if [ -n "$ANUMAAN_INTEGRITY_KEY" ]; then
            python scripts/integrity.py verify --require-signature
          else
            echo "::warning::ANUMAAN_INTEGRITY_KEY secret not set - signature not checked in CI. Production still refuses an unsigned manifest."
          fi

      - name: Tests (including tests/test_security.py and tests/test_platform.py)
        run: python -m pytest -q

      - name: SBOM + AI-BOM (CycloneDX 1.6) from the installed environment
        run: python scripts/make_sbom.py

      - name: Deployment manifests parse
        run: python -c "import yaml; yaml.safe_load(open('docker-compose.yml')); list(yaml.safe_load_all(open('deploy/k8s/anumaan.yaml')))"

      - name: Laya sidecar - locked dependencies, known-vulnerability audit, syntax
        working-directory: anumaan/laya-sidecar
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev
          node --check server.mjs && node --check fetch-model.mjs && node --check verify.mjs

      - name: Known-vulnerability audit of installed packages
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --progress-spinner off
