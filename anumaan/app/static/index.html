<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3864">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<title>ANUMAAN — live project risk</title>
<style>
  :root {
    --navy:#1f3864; --blue:#0f62a8; --orange:#e87722; --green:#1e7a46;
    --ink:#1a1a1a; --mute:#5b6575; --line:#dde4ee; --card:#f4f7fb;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 Calibri,Segoe UI,system-ui,sans-serif; color:var(--ink); background:#fff; }
  header { padding:14px 20px 0 20px; }
  h1 { margin:0 0 2px 0; font-size:22px; color:var(--navy); }
  .sub { color:var(--mute); font-size:13px; }
  #banner { margin:12px 20px; padding:10px 14px; border-radius:8px; font-size:13px; }
  .synthetic { background:#fff4f2; border-left:6px solid #b3261e; }
  .paimana { background:#f0f9f3; border-left:6px solid var(--green); }
  nav { display:flex; gap:6px; padding:0 20px; border-bottom:2px solid var(--line); }
  nav button { border:0; background:none; padding:10px 14px; font:inherit; cursor:pointer;
               color:var(--mute); border-bottom:3px solid transparent; }
  nav button.on { color:var(--navy); font-weight:700; border-bottom-color:var(--blue); }
  section { display:none; padding:16px 20px 40px 20px; }
  section.on { display:block; }
  .row { display:flex; gap:18px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px; }
  .ctl label { display:block; font-size:12px; color:var(--mute); margin-bottom:3px; }
  input[type=text], select, input[type=number] { padding:6px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  input[type=range] { width:220px; }
  button.go { background:var(--blue); color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; font:inherit; }
  button.go:hover { background:var(--navy); }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); }
  th { background:var(--card); color:var(--navy); }
  tr.clickable:hover { background:#f7fbff; cursor:pointer; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-weight:700; color:#fff; }
  .hi { background:#b3261e; } .mid { background:var(--orange); } .lo { background:var(--green); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
  .stat { background:var(--navy); color:#fff; border-radius:10px; padding:12px; }
  .stat b { display:block; font-size:22px; }
  .stat span { font-size:11px; color:#dbe6f6; }
  code { background:#eef3fa; padding:1px 5px; border-radius:4px; }
  .muted { color:var(--mute); font-size:12px; }
  .ok { color:var(--green); font-weight:700; } .bad { color:#b3261e; font-weight:700; }

  /* Tables. app.js puts every table in its own scroll box, so a phone never
     scrolls the whole page sideways. On a phone a wide table sits in a
     framed panel with its first column pinned, a fade where it continues,
     and a small position bar: it reads as "swipe me", not as cut off. */
  .twrap { position:relative; max-width:100%; }
  .tscroll { overflow-x:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; }
  .tbar { display:none; }
  tr.us td { background:#eef6ff; }
  /* The swipe coach: shown on the table itself, briefly, the first time a
     wide table comes into view, while the table slides left and back. */
  .tcoach { position:absolute; inset:0; z-index:3; pointer-events:none; opacity:0; transition:opacity .25s;
            border-radius:10px; background:rgba(15,32,64,.34); display:flex; flex-direction:column; align-items:center; }
  .tcoach.show { opacity:1; }
  .tcoach-in { position:sticky; top:30%; margin:26px 12px; display:flex; flex-direction:column; align-items:center;
               gap:4px; color:#fff; background:rgba(15,32,64,.88); padding:14px 24px 12px 24px; border-radius:16px;
               box-shadow:0 10px 30px rgba(0,0,0,.28); text-align:center; }
  .tcoach-in svg { width:46px; height:46px; }
  .tcoach.show .tcoach-in svg { animation:swipe 1s ease-in-out infinite; }
  .tcoach-in b { font-size:19px; line-height:1.2; }
  .tcoach-in span { font-size:13px; opacity:.92; }
  @keyframes swipe { 0% { transform:translateX(24px); opacity:0; } 20% { opacity:1; }
                     75% { transform:translateX(-24px); opacity:1; } 100% { transform:translateX(-24px); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .tcoach.show .tcoach-in svg { animation:none; } }
  svg { max-width:100%; height:auto; }
  code { overflow-wrap:anywhere; }
  /* Never let anything push the page sideways, even with a large phone font. */
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body { overflow-wrap:break-word; overflow-x:clip; }
  .short, #bannerToggle { display:none; }

  /* Phones and narrow windows */
  @media (max-width: 700px) {
    header { padding:12px 12px 0 12px; }
    h1 { font-size:18px; line-height:1.25; }
    .sub { font-size:12px; }
    #banner { margin:10px 12px 0 12px; font-size:12px; overflow-wrap:anywhere; }
    /* Clamp to two lines. The bottom padding becomes a transparent border, so
       the clipped third line cannot show through it. */
    #banner:not([data-open]) { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2;
                               overflow:hidden; padding-bottom:0; border-bottom:10px solid transparent; }
    #bannerToggle { display:block; margin:2px 12px 8px auto; border:0; background:none; color:var(--blue);
                    font:inherit; font-size:12px; font-weight:700; padding:4px 0; cursor:pointer; }
    /* Tabs: a grid whose columns may shrink below their text, so the buttons
       always stay on screen; long names have a short form on phones. */
    nav { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6px; padding:0 12px 10px 12px; }
    nav button { min-width:0; border:1px solid var(--line); border-radius:8px; padding:10px 6px; font-size:13px;
                 line-height:1.2; background:var(--card); text-align:center; overflow-wrap:anywhere; }
    nav button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
    .long { display:none; } .short { display:inline; }
    section { padding:12px 12px 32px 12px; }
    /* Wide tables: framed panel, pinned first column, fade, position bar. */
    .twrap.wide { margin-top:8px; }
    .twrap.wide .tscroll { border:1px solid var(--line); border-radius:10px; background:#fff; }
    .twrap.wide table { margin-top:0 !important; }
    .twrap.wide tr:last-child td { border-bottom:0; }
    .twrap.wide th:first-child, .twrap.wide td:first-child { position:sticky; left:0; z-index:1; background:#fff;
                 min-width:118px; max-width:40vw; white-space:normal; box-shadow:inset -1px 0 0 var(--line); }
    .twrap.wide th:first-child { background:var(--card); }
    .twrap.wide tr.us td:first-child { background:#eef6ff; }
    .twrap.more::after { content:""; position:absolute; top:1px; right:1px; bottom:1px; width:40px; z-index:2;
                         pointer-events:none; border-radius:0 10px 10px 0;
                         background:linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,.97)); }
    .twrap.scrolls + .tbar { display:block; position:relative; width:64px; height:4px; margin:8px auto 4px auto;
                             border-radius:2px; background:var(--line); }
    .tbar i { position:absolute; top:0; bottom:0; left:0; border-radius:2px; background:var(--blue); }
    .row { gap:10px; }
    .ctl { flex:1 1 100%; min-width:0; }
    .ctl input[type=text], .ctl select, .ctl input[type=number], input[type=range] { width:100%; }
    .ctl button.go, .ctl a.go { width:100%; text-align:center; }
    th { white-space:nowrap; }
    th, td { padding:6px 8px; }
    .grid { grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; }
    .stat b { font-size:18px; overflow-wrap:anywhere; }
    .card { padding:12px; }
  }
</style>
</head>
<body>
<header>
  <h1>ANUMAAN — auditing the stated completion date</h1>
  <div class="sub">Project Risk Score · Early Warning Alerts · Benchmarking · Prescriptive Decision Support — SIH26103</div>
</header>
<div id="banner">loading…</div>
<button id="bannerToggle" type="button" aria-controls="banner" aria-expanded="false">Details ▾</button>
<nav>
  <button class="on" data-tab="alerts">Early Warning Alerts</button>
  <button data-tab="audit">Project Audit</button>
  <button data-tab="model">Model Honesty</button>
  <button data-tab="pipeline">Data Pipeline</button>
  <button data-tab="bench"><span class="long">Benchmark vs Alternatives</span><span class="short">Benchmark</span></button>
  <button data-tab="offline">Offline</button>
</nav>

<section id="alerts" class="on">
  <div class="row">
    <div class="ctl"><label>Risk threshold: <b id="thrVal">0.30</b></label>
      <input type="range" id="thr" min="0" max="0.9" step="0.05" value="0.3"></div>
    <div class="ctl"><label>Ministry</label><select id="ministry"><option value="">All</option></select></div>
    <div class="ctl"><label>Search</label><input type="text" id="q" placeholder="project or ministry"></div>
    <div class="ctl"><button class="go" id="refresh">Refresh alerts</button></div>
  </div>
  <div class="muted" id="alertCount"></div>
  <table id="alertTable"><thead><tr>
    <th>Project</th><th>Ministry</th><th>Original DoC</th><th>Stated DoC</th>
    <th>Drift</th><th>Risk score</th><th>Cause</th><th>Owning authority</th>
  </tr></thead><tbody></tbody></table>
</section>

<section id="audit">
  <div class="row">
    <div class="ctl"><label>Project ID</label><input type="text" id="pid" placeholder="P0181"></div>
    <div class="ctl"><button class="go" id="loadProj">Open</button></div>
  </div>
  <div id="projBox" class="muted">Pick a project from Early Warning Alerts, or type an ID.</div>
</section>

<section id="model">
  <div class="row">
    <div class="ctl"><label>Walk-forward cutoff (train &lt; cutoff)</label><input type="text" id="cutoff" value="2025-01"></div>
    <div class="ctl"><button class="go" id="retrain">Retrain live</button></div>
    <div class="ctl muted" id="trainInfo"></div>
  </div>
  <div id="modelBox"></div>
</section>

<section id="pipeline">
  <div id="pipeBox"></div>
</section>

<section id="bench">
  <div id="benchBox"></div>
</section>

<section id="offline">
  <div id="offBox"></div>
</section>

<script src="/static/app.js" defer></script>
</body>
</html>
